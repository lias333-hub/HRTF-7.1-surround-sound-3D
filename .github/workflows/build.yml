name: Build APK
# Only on main (the dev-shell workflow uses other branches). Use [skip ci] in a commit message to skip.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true
      - name: Docs and code agree on the version
        run: bash ci/check_docs_version.sh
      - run: bash ci/prepare_android.sh
      - name: C++ core tests (host)
        run: bash ci/cpp_tests.sh
      - run: flutter analyze
      - run: flutter test
      - name: Kotlin unit tests
        run: cd android && ./gradlew :app:testDebugUnitTest --console=plain
      - run: flutter build apk --release
      - name: Verify the C++ core is in the APK for 32-bit and 64-bit ARM
        run: bash ci/check_native_libs.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Verify minSdk and permissions
        run: bash ci/check_apk_manifest.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Verify fixed test signing key
        run: bash ci/check_signing.sh build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: directional-audio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
